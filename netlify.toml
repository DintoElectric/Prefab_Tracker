[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Long cache for the scanned book images — they never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback. Function routes (declared via `config.path` in each
# function) are matched before this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
